name: backend

on:
  push:
    branches: [main]
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'fake_data/**', 'pyproject.toml', '.github/workflows/backend.yml']

# Least privilege: the job only needs to read the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
